<!DOCTYPE html>
<html>
<head>
  <base href="/wrindhaos/">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WrindhaOS Productivity App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WrindhaOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WrindhaOS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0D14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background-color: #0A0D14;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999999;
      transition: opacity 0.5s ease-out;
    }
    .loading-logo-box {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.2s infinite ease-in-out;
      overflow: hidden;
    }
    .loading-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
    }
    .loading-title {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }
    .loading-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
    }
    .spinner {
      margin-top: 26px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top: 3px solid #6366F1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo-box">
      <img src="assets/images/wrindha_logo.png" alt="WrindhaOS" onerror="this.style.display='none'">
    </div>
    <div class="loading-title">WrindhaOS</div>
    <div class="loading-subtitle">Organize. Focus. Elevate.</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    });

    setTimeout(function() {
      var loader = document.getElementById('loading-screen');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
